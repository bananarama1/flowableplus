services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DEBUG: ${DEBUG:-false}
      DEBUG_PORT: ${DEBUG_PORT:-5005}
      DEBUG_SUSPEND: ${DEBUG_SUSPEND:-n}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: ./flowableplus-example-app/src/main/java
          target: /workspace/flowableplus-example-app/src/main/java
        - action: sync+restart
          path: ./flowableplus-example-app/src/main/resources
          target: /workspace/flowableplus-example-app/src/main/resources
        - action: sync+restart
          path: ./flowableplus-example-models/src/main/resources
          target: /workspace/flowableplus-example-models/src/main/resources
        - action: sync+restart
          path: ./flowableplus-work-core/src/main/java
          target: /workspace/flowableplus-work-core/src/main/java
        - action: sync+restart
          path: ./flowableplus-work-autoconfigure/src/main/java
          target: /workspace/flowableplus-work-autoconfigure/src/main/java
        - action: sync+restart
          path: ./flowableplus-work-autoconfigure/src/main/resources
          target: /workspace/flowableplus-work-autoconfigure/src/main/resources
        - action: sync+restart
          path: ./flowableplus-work-test-models/src/main/resources
          target: /workspace/flowableplus-work-test-models/src/main/resources
        - action: rebuild
          path: ./pom.xml
        - action: rebuild
          path: ./flowableplus-example-app/pom.xml
        - action: rebuild
          path: ./flowableplus-work-starter/pom.xml
        - action: rebuild
          path: ./flowableplus-work-autoconfigure/pom.xml
        - action: rebuild
          path: ./flowableplus-work-core/pom.xml
        - action: rebuild
          path: ./flowableplus-example-models/pom.xml

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowable
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: flowable
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowable -d flowable"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  maven-cache:
  postgres-data: