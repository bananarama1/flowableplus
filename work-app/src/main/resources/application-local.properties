spring.config.activate.on-profile=local
spring.application.name=work-app
server.port=8081

spring.datasource.url=${WORK_DB_URL:jdbc:postgresql://localhost:5432/flowableplus_work?currentSchema=flowable_local}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${WORK_DB_USERNAME:flowableplus}
spring.datasource.password=${WORK_DB_PASSWORD:flowableplus-dev}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:/db/changelog/work-master.yaml
spring.liquibase.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=${WORK_DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${WORK_DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${WORK_DB_POOL_CONNECTION_TIMEOUT_MS:30000}

flowable.database-schema-update=true
flowableplus.work.runtime.database-schema-update=update