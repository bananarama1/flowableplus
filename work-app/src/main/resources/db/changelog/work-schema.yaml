databaseChangeLog:
  - changeSet:
      id: work-1
      author: flowableplus
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "0"
            sql: "SELECT COUNT(*) FROM information_schema.tables WHERE table_name = 'audit_event'"
      changes:
        - createTable:
            tableName: audit_event
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: actor_id
                  type: varchar(255)
              - column:
                  name: client_id
                  type: varchar(255)
              - column:
                  name: target
                  type: varchar(255)
              - column:
                  name: timestamp
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: operation
                  type: varchar(255)
              - column:
                  name: outcome
                  type: varchar(255)
              - column:
                  name: correlation_id
                  type: varchar(255)
  - changeSet:
      id: work-2
      author: flowableplus
      changes:
        - createTable:
            tableName: publication_record
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: model_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: model_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: correlation_id
                  type: varchar(255)
              - column:
                  name: actor_id
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: runtime_reference
                  type: varchar(255)
              - column:
                  name: failure_code
                  type: varchar(255)
              - column:
                  name: failure_message
                  type: varchar(1000)
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: form_schema_json
                  type: clob
              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: publication_record
            columnNames: client_id, model_key, version, idempotency_key
            constraintName: uk_publication_record_idempotency
