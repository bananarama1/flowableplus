schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  FlowablePlus is a Java 17, Spring Boot 4, Flowable 8 Maven multi-module project. modeler-app owns design-time projects, versions, and publication intent; work-app owns publication intake, Flowable execution, tasks, and runtime history; platform-contracts and platform-flowable provide shared boundaries. OpenSpec specs define observable behavior, docs define repository contracts and operations, .github/instructions defines implementation constraints, and .github/skills defines repeatable procedures and validation.

rules:
  proposal:
    - "Include an `## Agent Impact` section with one explicit decision: no instruction or skill changes required, an existing customization must be updated, or a new customization is required."
    - "When agent impact is not no-impact, list affected `.github` customization files and include corresponding implementation and validation tasks."
    - "For repeated guidance, classify the source of truth as an OpenSpec spec, repository documentation, an instruction constraint, or a skill procedure; link derived guidance to its authority instead of copying requirements."
  tasks:
    - "Include implementation and validation tasks for every affected customization file identified by `## Agent Impact`."
    - "Keep documentation-only customization work separate from product capability changes and do not add a capability spec when observable behavior is unchanged."
