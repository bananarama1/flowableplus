services:
  postgres:
    image: postgres:16-alpine
    container_name: flowableplus-postgres
    environment:
      POSTGRES_DB: flowableplus_work
      POSTGRES_USER: flowableplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowableplus-dev}
    ports:
      - "5432:5432"
    volumes:
      - flowableplus-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowableplus -d flowableplus_work"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  flowableplus-postgres-data: