spring.config.activate.on-profile=local
spring.application.name=modeler-app
server.port=8080

spring.datasource.url=${MODELER_DB_URL:jdbc:postgresql://localhost:5432/flowableplus_modeler}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${MODELER_DB_USERNAME:flowableplus}
spring.datasource.password=${MODELER_DB_PASSWORD:flowableplus-dev}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:/db/changelog/modeler-master.yaml
spring.liquibase.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=${MODELER_DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${MODELER_DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${MODELER_DB_POOL_CONNECTION_TIMEOUT_MS:30000}

flowableplus.modeler.publication.base-url=${FLOWABLEPLUS_WORK_URL:http://localhost:8081}