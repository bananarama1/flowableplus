spring.application.name=modeler-app

spring.datasource.url=jdbc:h2:mem:modeler;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:/db/changelog/modeler-master.yaml
spring.liquibase.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
flowableplus.modeler.publication.base-url=http://localhost:8081
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n